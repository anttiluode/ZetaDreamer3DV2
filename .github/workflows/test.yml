name: Zeta V2 mathematical checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  harmonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p 'test_*v2.py' -v
      - name: Verify viewer contains all five sampled volume textures
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('zeta_volume_viewer_template.html').read_text()
          for tag in ('uHarm0','uHarm1','harmonic_rms_curve','uPartner','sampleZ(', 'Digit[1-9]'):
              assert tag in t,tag
          print('Verified viewer controls and reference bindings')
          PY

      - name: Parse viewer JavaScript syntax with Node
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('zeta_volume_viewer_template.html').read_text()
          js=t.split('<script>',1)[1].split('</script>',1)[0]
          js=js.replace('__EMBEDDED_DATA__','{}')
          Path('/tmp/zeta_viewer_check.cjs').write_text(js)
          PY
          node --check /tmp/zeta_viewer_check.cjs
