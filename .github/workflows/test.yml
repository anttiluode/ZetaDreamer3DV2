name: Zeta V2 mathematical checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  harmonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p 'test_harmonic_v2.py' -v
      - name: Verify viewer contains all five sampled volume textures
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('zeta_volume_viewer_template.html').read_text()
          for tag in ('uHarm0','uHarm1','harmonic_rms_curve','uPartner','sampleZ(', 'Digit[1-9]'):
              assert tag in t,tag
          print('Verified viewer controls and reference bindings')
          PY
